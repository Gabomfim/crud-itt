[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "crud-itt"
version = "1.0.0"
description = "A comprehensive FastAPI application with full user management capabilities"
authors = ["Gabomfim <your.email@example.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/Gabomfim/crud-itt"
keywords = ["fastapi", "crud", "api", "async", "sqlalchemy"]
package-mode = false
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
jinja2 = "^3.1.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
asyncpg = "^0.29.0"
aiosqlite = "^0.19.0"
python-multipart = "^0.0.6"
pydantic = "^2.12.0"
pydantic-settings = "^2.12.0"
bcrypt = "^4.1.2"
pyjwt = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"
black = "^23.12.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
pre-commit = "^3.6.0"
coverage = "^7.3.2"
pytest-cov = "^4.1.0"
safety = "^2.3.5"
bandit = "^1.7.5"
mypy = "^1.7.1"

# Scripts can be run using poetry run <command>
# Example: poetry run uvicorn app:app --host 0.0.0.0 --port 8000 --reload

# Black - Python Code Formatter Configuration

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# Skip string normalization (keep single quotes if preferred)
skip-string-normalization = false

# Skip magic trailing comma
skip-magic-trailing-comma = false

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    "env/*",
    "*/__pycache__/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]

# isort configuration
[tool.isort]
profile = "black"
known_first_party = ["api", "database", "models", "services", "tests"]
known_third_party = ["fastapi", "sqlalchemy", "pydantic", "pytest", "httpx", "bcrypt"]
skip_gitignore = true

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:distutils.*",
    "ignore::DeprecationWarning:urllib3.*",
    "ignore::UserWarning:anyio.*",
    "ignore::RuntimeWarning:asyncio.*"
]
asyncio_mode = "auto"

# mypy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false