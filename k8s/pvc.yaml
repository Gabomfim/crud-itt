apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crud-itt-database-pvc
  namespace: crud-itt
  labels:
    app: fastapi-crud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard  # Adjust based on your cluster's storage classes