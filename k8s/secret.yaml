apiVersion: v1
kind: Secret
metadata:
  name: crud-itt-secrets
  namespace: crud-itt
  labels:
    app: fastapi-crud
type: Opaque
data:
  # Base64 encoded secrets (you should replace these with actual values)
  # To encode: echo -n "your-secret-value" | base64
  
  # JWT secret key for authentication (replace with your own)
  JWT_SECRET_KEY: c2VjcmV0LWp3dC1rZXktZm9yLWF1dGhlbnRpY2F0aW9u  # secret-jwt-key-for-authentication
  
  # Database password (if using external DB)
  DB_PASSWORD: cGFzc3dvcmQ=  # password
  
  # Admin credentials
  ADMIN_USERNAME: YWRtaW4=  # admin
  ADMIN_PASSWORD: YWRtaW5wYXNz  # adminpass