apiVersion: v1
kind: ConfigMap
metadata:
  name: crud-itt-config
  namespace: crud-itt
  labels:
    app: fastapi-crud
data:
  # Database configuration
  DATABASE_URL: "sqlite+aiosqlite:///./data/app.db"
  
  # Application configuration
  APP_NAME: "FastAPI CRUD Application"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  
  # Server configuration
  HOST: "0.0.0.0"
  PORT: "8000"
  
  # CORS configuration
  CORS_ORIGINS: "*"
  
  # Logging configuration
  LOG_LEVEL: "info"
  JSON_LOGS: "true"