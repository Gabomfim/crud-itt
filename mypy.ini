[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
# Ignore arg-type errors for template responses (starlette version mismatch)
disable_error_code = arg-type
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Exclude problematic files
exclude = database/init.py

# Per-module options for specific modules that might need looser checking
[mypy-database.init]
ignore_errors = True

# Ignore Starlette template response type issues (version mismatch)
[mypy-starlette.templating]
ignore_missing_imports = True
ignore_errors = True

[mypy-tests.*]
ignore_errors = True