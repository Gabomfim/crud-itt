name: Development Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Quick syntax check
      run: |
        poetry run python -m py_compile $(find . -name "*.py" -not -path "./venv/*" -not -path "./.env/*")
    
    - name: Run fast tests only
      run: |
        poetry run pytest tests/ -x --tb=short -q --disable-warnings
      
    - name: Check code formatting
      run: |
        poetry run black --check .
        
    - name: Check import sorting
      run: |
        poetry run isort --check-only .

  comment-coverage:
    runs-on: ubuntu-latest
    needs: quick-checks
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Run tests with coverage
      run: |
        poetry run coverage run -m pytest
        poetry run coverage report -m > coverage_report.txt
    
    - name: Comment PR with coverage
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('coverage_report.txt', 'utf8');
          
          const body = `## Test Coverage Report
          
          \`\`\`
          ${coverage}
          \`\`\`
          
          Generated by GitHub Actions 🚀`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });