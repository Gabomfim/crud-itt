name: Deploy to Staging

on:
  push:
    branches: [ staging ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENVIRONMENT: staging

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.inputs.force_deploy != 'true'
    
    strategy:
      matrix:
        python-version: [3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-
    
    - name: Install dependencies
      run: poetry install --with dev
    
    - name: Run pre-commit hooks
      run: poetry run pre-commit run --all-files
    
    - name: Run tests
      run: |
        poetry run pytest tests/ -v --tb=short
        poetry run pytest --cov=. --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || github.event.inputs.force_deploy == 'true')
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=staging-latest
        labels: |
          org.opencontainers.image.title=CRUD-ITT Staging
          org.opencontainers.image.description=FastAPI CRUD application - Staging Environment
          org.opencontainers.image.vendor=ITT
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          ENVIRONMENT=staging
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure AWS credentials (if using EKS)
      uses: aws-actions/configure-aws-credentials@v4
      if: env.CLOUD_PROVIDER == 'aws'
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Configure kubeconfig for EKS
      if: env.CLOUD_PROVIDER == 'aws'
      run: |
        aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
    
    - name: Set up kubeconfig from secret
      if: env.CLOUD_PROVIDER != 'aws'
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
    
    - name: Verify Kubernetes connection
      run: |
        kubectl cluster-info
        kubectl get nodes
    
    - name: Create namespace if not exists
      run: |
        kubectl create namespace crud-itt-staging --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Create/Update ConfigMap
      run: |
        kubectl create configmap crud-itt-config \
          --from-literal=APP_NAME="CRUD ITT Staging" \
          --from-literal=APP_VERSION="${{ github.sha }}" \
          --from-literal=APP_ENVIRONMENT="staging" \
          --from-literal=APP_DEBUG="false" \
          --from-literal=DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
          --from-literal=DATABASE_ECHO="false" \
          --from-literal=LOG_LEVEL="INFO" \
          --from-literal=SERVER_HOST="0.0.0.0" \
          --from-literal=SERVER_PORT="8000" \
          --namespace=crud-itt-staging \
          --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Create/Update Secrets
      run: |
        kubectl create secret generic crud-itt-secrets \
          --from-literal=SECURITY_SECRET_KEY="${{ secrets.STAGING_SECRET_KEY }}" \
          --from-literal=DATABASE_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}" \
          --namespace=crud-itt-staging \
          --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Update deployment image
      run: |
        # Create a staging-specific deployment from the template
        sed 's/crud-itt:/crud-itt-staging:/g; s/namespace: crud-itt/namespace: crud-itt-staging/g' k8s/deployment.yaml > k8s/deployment-staging.yaml
        
        # Update the image tag
        kubectl set image deployment/crud-itt-app \
          fastapi-crud=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest \
          --namespace=crud-itt-staging
    
    - name: Deploy to Kubernetes
      run: |
        # Apply all Kubernetes manifests for staging
        for file in k8s/*.yaml; do
          if [[ "$file" != *"deployment.yaml" ]]; then
            sed 's/namespace: crud-itt/namespace: crud-itt-staging/g; s/crud-itt-/crud-itt-staging-/g' "$file" | kubectl apply -f -
          fi
        done
        
        # Apply the staging deployment
        kubectl apply -f k8s/deployment-staging.yaml
    
    - name: Wait for deployment to be ready
      run: |
        kubectl rollout status deployment/crud-itt-app \
          --namespace=crud-itt-staging \
          --timeout=300s
    
    - name: Run health check
      run: |
        # Get the service URL and perform health check
        SERVICE_IP=$(kubectl get service crud-itt-service -n crud-itt-staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        if [ -z "$SERVICE_IP" ]; then
          SERVICE_IP=$(kubectl get service crud-itt-service -n crud-itt-staging -o jsonpath='{.spec.clusterIP}')
        fi
        
        echo "Health checking staging deployment..."
        kubectl run health-check --rm -i --restart=Never --image=curlimages/curl:latest -- \
          curl -f http://$SERVICE_IP:8000/health || echo "Health check failed, but deployment continues"
    
    - name: Post deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🚀 Staging deployment completed successfully!"
          echo "Environment: staging"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "Commit: ${{ github.sha }}"
        else
          echo "❌ Staging deployment failed!"
        fi

  notify:
    runs-on: ubuntu-latest
    needs: [test, build-and-deploy]
    if: always()
    
    steps:
    - name: Send Slack notification
      if: env.SLACK_WEBHOOK_URL != ''
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          Staging Deployment Result: ${{ needs.build-and-deploy.result }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Actor: ${{ github.actor }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}