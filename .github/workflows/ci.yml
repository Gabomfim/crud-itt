name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, '3.10', 3.11, 3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check for unused imports and variables
        poetry run flake8 . --count --select=F401,F841 --show-source --statistics
        # General linting (non-blocking)
        poetry run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Check code formatting with Black
      run: |
        poetry run black --check --diff .
    
    - name: Sort imports with isort
      run: |
        poetry run isort --check-only --diff .
    
    - name: Type check with mypy
      run: |
        poetry run mypy .
    
    - name: Run tests with pytest
      run: |
        poetry run pytest --tb=short -v
    
    - name: Generate coverage report
      run: |
        poetry run coverage run -m pytest
        poetry run coverage report -m
        poetry run coverage xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Run safety check
      run: |
        poetry run safety check --json || true
    
    - name: Run bandit security scan
      run: |
        poetry run bandit -r . -x tests/ -f json || true

  build-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: |
        poetry install
    
    - name: Test application startup
      run: |
        timeout 10s poetry run uvicorn app:app --host 0.0.0.0 --port 8000 || code=$?; 
        if [[ $code -ne 124 && $code -ne 0 ]]; then 
          echo "Application failed to start"
          exit 1
        fi
        echo "Application started successfully"
    
    - name: Build Docker image (if Dockerfile exists)
      run: |
        if [ -f Dockerfile ]; then
          docker build -t crud-itt-test .
          echo "Docker image built successfully"
        else
          echo "No Dockerfile found, skipping Docker build"
        fi