name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Type check with mypy
      run: |
        poetry run mypy .
    
    - name: Run full test suite
      run: |
        poetry run pytest --tb=short -v
    
    - name: Build package
      if: contains(github.ref, 'refs/tags/')
      run: |
        poetry build
    
    - name: Build Docker image
      if: contains(github.ref, 'refs/tags/')
      run: |
        docker build -t crud-itt:${{ github.ref_name }} .
        docker build -t crud-itt:latest .
    
    - name: Create GitHub Release Assets
      if: contains(github.ref, 'refs/tags/')
      run: |
        # Create a source distribution
        mkdir -p dist/
        tar -czf dist/crud-itt-${{ github.ref_name }}.tar.gz \
          --exclude='.git' \
          --exclude='__pycache__' \
          --exclude='.pytest_cache' \
          --exclude='venv' \
          --exclude='.env' \
          .
        
        # Create checksums
        cd dist/
        sha256sum *.tar.gz > checksums.txt
    
    - name: Upload Release Assets
      if: contains(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.tar.gz
          dist/checksums.txt
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Run security audit
      run: |
        echo "## Security Audit Report" > security_report.md
        echo "" >> security_report.md
        echo "### Safety Check (Known Vulnerabilities)" >> security_report.md
        echo "\`\`\`" >> security_report.md
        poetry run safety check || echo "Safety check completed with warnings" >> security_report.md
        echo "\`\`\`" >> security_report.md
        echo "" >> security_report.md
        echo "### Bandit Static Analysis" >> security_report.md
        echo "\`\`\`" >> security_report.md
        poetry run bandit -r . -x tests/ || echo "Bandit scan completed with warnings" >> security_report.md
        echo "\`\`\`" >> security_report.md
    
    - name: Upload Security Report
      if: contains(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: security_report.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}